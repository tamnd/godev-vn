name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  # The Go the site is built and tested with. go.mod stays on upstream's
  # version on purpose: it is a minimum language version, changing it in the
  # fork puts a seventh file into the divergence and makes every upstream sync
  # conflict on go.mod, and it says nothing about what CI runs. This does.
  GO_VERSION: '1.27.0'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # GODEV_CONTENT=en turns the Vietnamese overlay off.
      #
      # This suite is upstream's and it asserts English strings: cmd/golangorg
      # checks that every release notes page carries its release date, and
      # internal/tour checks for `>A Tour of Go<`. Neither goes through the
      # server's -content flag, so with the overlay on they get Vietnamese and
      # fail, and they are not wrong to. What they are testing is the renderer,
      # and the fork has to not break the renderer.
      #
      # Whether the translation is any good is a different question with a
      # different answer, and that is the audit job below.
      #
      # cmd/screentest is excluded because it dials Google Cloud Storage for
      # screenshot baselines and cannot pass without credentials. That is true
      # upstream too.
      - name: test
        env:
          GODEV_CONTENT: en
        run: go test $(go list ./... | grep -v /cmd/screentest)

      # The overlay is the fork, so it is tested with the overlay on.
      - name: test the overlay
        run: go test -run 'TestOverlay|TestGODEVCONTENT' -v .

  # The quality gates, from tamnd/godev-vn-translator, run against this
  # checkout. Fifteen deterministic rules over every English and Vietnamese
  # pair: dropped links, invented heading anchors, edited code blocks,
  # translated template actions, front matter that moved, and whether each
  # translation still matches the English it was made from.
  #
  # -max is a ratchet and not a target. The corpus has 63 refusals today, so a
  # gate demanding zero would be red on every pull request including the ones
  # fixing it, and a check that is always red is a check somebody turns off.
  # This one fails at 64. The number comes down in the same diff as the work
  # that lowers it, which makes it a reviewable claim, and the day it reaches
  # zero the flag comes off.
  #
  # It went up once, from 75 to 107, and that is the one direction a ratchet is
  # not supposed to move. It moved because a new gate landed and not because the
  # corpus got worse. L15 counts the HTML comments, which on the release notes
  # are the `<!-- CL 29072 -->` lines tying each bullet to the change behind it,
  # and it found 32 that the Vietnamese had dropped. Those 32 were already on
  # disk before the rule existed. The alternative was to hold the rule back
  # until they were fixed, which means a day of editing with nothing telling you
  # what to edit.
  #
  # 107 to 83 was those 32 comments being restored. 83 to 81 is one of each: a
  # code block in doc/security/fuzz/technical.md put back to English, which is
  # content, and L11 taught that a stylesheet is not untranslated prose, which
  # is a rule that was wrong. L04 changed too and the number did not. It stopped
  # refusing two slides that had lost nothing and started refusing two that had.
  #
  # 81 to 73 is six pieces of content and one more rule. The content is three
  # issue comments put back in blog/go1.23.md, a whole paragraph that blog/json.md
  # had dropped, and two links that lost their targets in the release notes. The
  # rule is L04 again: a present section is allowed to have no title, the decks
  # use that for the slides that are one full bleed image, and the Vietnamese
  # wrote a bare star where the English wrote a star and two trailing spaces.
  #
  # 73 to 72 is the last L05. blog/generic-interfaces.md translated a heading and
  # translated the link pointing at it, and the anchor a Vietnamese heading gets
  # from the renderer is not the one the translator wrote by hand, so the link
  # went nowhere. The Vietnamese heading declares the id explicitly now. The rule
  # suggests putting it on the English heading instead, which would survive the
  # page being translated again, but that means editing _content and the fork is
  # deliberately two conflictable files wide. This ratchet is what makes the fix
  # durable: if the retranslation breaks the anchor again, the gate says so.
  #
  # 72 to 54 is the first eight files coming back from the machine rather than
  # from somebody editing. Five of the 32 the upstream sync moved, retranslated
  # against the English on disk now, and three that stopped early partway
  # through. One diff clears 18: nine dropped links, five stale records, three
  # truncations and one heading tree.
  #
  # Two more files came back and are not here. blog/gofix.md and blog/inliner.md
  # have five pieces between them that spent all three attempts while every
  # route was refusing, so they assembled with those five paragraphs still in
  # English. That is the documented behaviour and it is right for a page that is
  # otherwise whole, but it is not something to commit while the pieces can
  # simply be asked for again. They are worth another seven when they land.
  #
  # 54 to 63 goes up, and it is the second time and for the same reason as the
  # first. L07 learns to read an HTML anchor. It has always read Markdown links
  # only, which meant that on 55 translated .html pages carrying 772 href and
  # src targets between them it was checking nothing at all, and that is how ten
  # anchors reading href="[url](url)" reached _content_vi and sat there through
  # a review. Those ten are fixed. The nine this adds are real dropped links
  # that were already on disk: three JSON v2 entries missing from doc/index.html,
  # one from doc/tutorial/index.html, an install link from create-module.html,
  # and four in doc/manage-install.html, which needs retranslating anyway.
  #
  # Raise this before the translator pull request merges, not after. The job
  # below checks that repository out at its default branch.
  #
  # The eight files also came back with three words translated that the rest of
  # the corpus leaves in English, and no gate caught any of them, because none of
  # the three was in GLOSSARY.md to catch them with. `interface` became `giao
  # diện`, `map` became `bản đồ`, and Contributors Summit became a diplomatic
  # summit. The counts settle all three: the corpus writes `kiểu interface` 97
  # times against 4 the other way, the four `bản đồ` already on disk are all real
  # maps, and blog/contributors-summit.md writes the event name in English. So
  # the eleven occurrences are fixed by hand here and the four rows are in the
  # glossary, which puts them in the prompt for the next run and under L10 for
  # the files already written. That found five more, which are notices and are
  # not in this diff.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: godev-vn
      - uses: actions/checkout@v7
        with:
          repository: tamnd/godev-vn-translator
          path: translator
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: translator/go.sum

      # One invocation, because a run reads all 680 files and there is no reason
      # to do that twice. The report is written before the exit status is
      # decided, so it exists whether the gate passes or fails, and a failure is
      # exactly when it is worth reading.
      - name: audit
        working-directory: translator
        run: go run ./cmd/godev -C ../godev-vn audit -max 63 -report audit.md

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: audit
          path: godev-vn/audit.md
